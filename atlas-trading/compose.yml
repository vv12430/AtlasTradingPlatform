name: atlas-trading
services:
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim
    environment:
      ORACLE_PASSWORD: LocalAdmin123
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./infra/oracle:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
  portfolio:
    profiles: ["full"]
    build:
      context: .
      args:
        SERVICE: portfolio
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: portfolio
      DB_PASSWORD: AtlasLocal123
      KAFKA_BOOTSTRAP: kafka:29092
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
  risk:
    profiles: ["full"]
    build:
      context: .
      args:
        SERVICE: risk
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: risk
      DB_PASSWORD: AtlasLocal123
      KAFKA_BOOTSTRAP: kafka:29092
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
  accounting:
    profiles: ["full"]
    build:
      context: .
      args:
        SERVICE: accounting
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: accounting
      DB_PASSWORD: AtlasLocal123
      KAFKA_BOOTSTRAP: kafka:29092
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
  frontend:
    profiles: ["full"]
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - portfolio
      - risk
      - accounting
volumes:
  oracle-data:
  kafka-data:
