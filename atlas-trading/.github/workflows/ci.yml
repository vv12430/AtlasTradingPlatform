name: verify
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  oracle-kafka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: docker compose --profile full up -d --build
      - name: Wait for services
        run: |
          for port in 8081 8082 8083; do
            timeout 300 bash -c "until curl -fsS http://localhost:$port/actuator/health; do sleep 5; done"
          done
      - run: node scripts/smoke.mjs
      - name: Browser workflow against Oracle and Kafka
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - run: docker compose logs
        if: failure()
      - run: docker compose --profile full down -v
        if: always()
